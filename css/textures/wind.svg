    <path d="M0 26 C 60 14, 100 14, 160 26 S 260 38, 320 26"/>
    <path d="M40 70 C 80 62, 120 62, 170 70 S 250 78, 280 72"/>
    <path d="M0 112 C 50 120, 110 120, 160 112 S 270 104, 320 112"/>
  </g>
</svg>
