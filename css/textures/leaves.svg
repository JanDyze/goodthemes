<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- Two sprigs and a stray leaf, kept inside the tile so nothing is cut at the seams. -->
  <defs>
    <path id="l" d="M0 0 C 6 -8, 20 -9, 28 0 C 20 9, 6 8, 0 0 Z"/>
  </defs>
  <g fill="{c}" fill-opacity="{o}" stroke="{c}" stroke-opacity="{o}" stroke-width="1" stroke-linecap="round">
    <g transform="translate(34 196) rotate(-38)">
      <path d="M0 0 C 26 -4, 58 -2, 92 6" fill="none"/>
      <use href="#l" transform="translate(20 -2) rotate(-40)"/>
      <use href="#l" transform="translate(40 -3) rotate(38)"/>
      <use href="#l" transform="translate(60 -1) rotate(-34)"/>
      <use href="#l" transform="translate(78 3) rotate(30)"/>
      <use href="#l" transform="translate(90 6) rotate(6) scale(.9)"/>
    </g>
    <g transform="translate(150 40) rotate(28)">
      <path d="M0 0 C 20 6, 44 6, 70 0" fill="none"/>
      <use href="#l" transform="translate(16 3) rotate(36) scale(.8)"/>
      <use href="#l" transform="translate(32 5) rotate(-40) scale(.85)"/>
      <use href="#l" transform="translate(50 3) rotate(34) scale(.8)"/>
      <use href="#l" transform="translate(66 1) rotate(-12) scale(.75)"/>
    </g>
    <use href="#l" transform="translate(190 170) rotate(112) scale(.9)"/>
    <circle cx="112" cy="120" r="1.6" stroke="none"/>
    <circle cx="120" cy="127" r="1.1" stroke="none"/>
    <circle cx="226" cy="236" r="1.4" stroke="none"/>
    <circle cx="70" cy="44" r="1.2" stroke="none"/>
  </g>
</svg>
