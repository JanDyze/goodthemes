<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Sparse specks: noise is thresholded so only the brightest ~15% of it shows, tinted {c}.
       Kept to a small tile and one octave: feTurbulence is rasterized per tile, and this is
       the most expensive thing a theme paints when it switches in. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 {r}  0 0 0 0 {g}  0 0 0 0 {b}  3.2 0 0 0 -1.75"/>
  </filter>
  <rect width="128" height="128" filter="url(#g)" opacity="{o}"/>
</svg>
